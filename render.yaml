services:
  - type: worker
    name: ulp-scanner-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: data
      - key: MAX_FILE_SIZE_MB
        value: 2048
      - key: CHUNK_SIZE_LINES
        value: 500000
